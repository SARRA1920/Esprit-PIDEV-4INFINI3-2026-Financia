# Alternative Email Configuration - Mailtrap (for testing)
# Sign up at https://mailtrap.io (free)
# Get your credentials from Mailtrap inbox settings

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=YOUR_MAILTRAP_USERNAME
spring.mail.password=YOUR_MAILTRAP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Instructions:
# 1. Go to https://mailtrap.io
# 2. Sign up for free
# 3. Go to Email Testing > Inboxes > My Inbox
# 4. Click "Show Credentials"
# 5. Copy username and password
# 6. Replace above values
# 7. All emails will be caught by Mailtrap (no real emails sent)
