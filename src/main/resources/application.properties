spring.application.name=financia
spring.application.description=Financia - Educational Platform with AI-powered features

### Serveur ###
# 8080 souvent déjà pris (autre instance Java, outil, etc.) — aligné avec financia-angular environment.apiUrl
server.port=8083
server.servlet.context-path=/f

# Audit conformité épargne (seuils EUR — harmoniser avec le front si besoin)
financia.audit.large-withdrawal-threshold=500
financia.audit.large-deposit-threshold=2000
server.address=127.0.0.1
server.error.include-message=always
server.error.include-exception=true

### Base de données ###
spring.datasource.url=jdbc:mysql://localhost:3306/Financia?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

### Static frontend (VaultEdge template) ###
# Serve static assets from a dedicated working folder (frontend/) first,
# with the original template folder as fallback.
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/,file:./frontend/,file:./vaultedge-1.0.0/

### JPA / HIBERNATE ###
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Données de démo LMS : 2 parcours + leçons (uniquement si la table courses est vide au démarrage)
app.formation.seed-demo-data=true

### File Upload Configuration ###
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
upload.path=uploads/

### Logging Configuration ###
logging.level.root=INFO
logging.level.tn.esprit.financia=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

