spring.application.name=Financia
spring.application.description=Financia - Educational Platform with AI-powered features

### Serveur ###
server.port=8083
server.servlet.context-path=/f
server.address=127.0.0.1
server.error.include-message=always
server.error.include-exception=true
# Inscription avec image base64 (Face ID) : corps JSON > limite Tomcat par défaut (2 Mo).
server.tomcat.max-http-post-size=20MB

### Base de données ###
spring.datasource.url=jdbc:mysql://localhost:3306/Financia?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

### JPA / Hibernate ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

### Static frontend (VaultEdge template) ###
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/,file:./frontend/,file:./vaultedge-1.0.0/

# Données de démo LMS : 2 parcours + leçons (uniquement si la table courses est vide au démarrage)
app.formation.seed-demo-data=true

### Fichiers upload ###
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
upload.path=uploads/

### Logging ###
logging.level.root=INFO
logging.level.tn.esprit.financia=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

