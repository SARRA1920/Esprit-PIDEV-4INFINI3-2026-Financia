spring.application.name=financia
spring.datasource.url=jdbc:mysql://localhost:3306/Fiancia?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

### JPA / HIBERNATE ###
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

### Server Configuration ###
server.servlet.context-path=/f
server.port=8080

### File Upload Configuration ###
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
upload.path=uploads/

### Logging Configuration ###
logging.level.root=INFO
logging.level.tn.fiancia.financia=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

### Application Info ###
spring.application.description=Financia - Educational Platform with AI-powered features
